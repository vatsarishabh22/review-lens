# Built against IntelliJ IDEA (Java and Kotlin bundled) plus the PythonCore plugin for the same 2026.1 build.
platformVersion=2026.1.5
pythonCoreVersion=261.27258.48
# The sandbox IDE (runIdeForUiTests): the installed PyCharm when it is there, else this version is downloaded.
platformPath=/Applications/PyCharm.app
pycharmVersion=2026.1.5
pluginVersion=0.1.3
# The IDEs the Plugin Verifier checks (product code:version); CI makes one job per entry
verifyIdes=IU:2026.1.5,PY:2026.1.5,WS:2026.1.5,GO:2026.1.5,IU:2026.2.3
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.java.installations.paths=/Applications/PyCharm.app/Contents/jbr/Contents/Home
org.gradle.jvmargs=-Djava.net.preferIPv4Stack=true

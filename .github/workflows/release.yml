name: Release

# Push a tag like v0.2.0: the plugin is built at that version and attached to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      HAS_MARKETPLACE_TOKEN: ${{ secrets.PUBLISH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test buildPlugin -PpluginVersion="${VERSION#v}"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" build/distributions/*.zip --title "Review Lens ${VERSION#v}" --generate-notes
      # Marketplace: skipped until the PUBLISH_TOKEN and signing secrets are added to the repo
      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        if: env.HAS_MARKETPLACE_TOKEN == 'true'
        run: ./gradlew publishPlugin -PpluginVersion="${VERSION#v}"

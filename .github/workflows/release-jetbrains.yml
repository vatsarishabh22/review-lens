name: Release JetBrains

# Push a tag like jetbrains-v0.2.0: the plugin is built at that version and attached to a GitHub Release.
on:
  push:
    tags: ['jetbrains-v*']

permissions:
  contents: write

defaults:
  run:
    working-directory: jetbrains

jobs:
  release:
    name: JetBrains · release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      HAS_MARKETPLACE_TOKEN: ${{ secrets.PUBLISH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, to find this editor's previous release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test buildPlugin -PpluginVersion="${VERSION#jetbrains-v}"
      # notes since this editor's previous release, not since the other editor's
      - name: Previous JetBrains release
        run: echo "PREVIOUS=$(git describe --tags --abbrev=0 --match 'jetbrains-v*' "$VERSION^" 2>/dev/null)" >> "$GITHUB_ENV"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" build/distributions/*.zip --title "Review Lens for JetBrains ${VERSION#jetbrains-v}" --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}
      # Marketplace: skipped until the PUBLISH_TOKEN and signing secrets are added to the repo
      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        if: env.HAS_MARKETPLACE_TOKEN == 'true'
        run: ./gradlew publishPlugin -PpluginVersion="${VERSION#jetbrains-v}"

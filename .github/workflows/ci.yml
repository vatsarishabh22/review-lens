name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test buildPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: review-lens-plugin
          path: build/distributions/*.zip

  verify:
    name: Verify plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # JetBrains' Plugin Verifier against IntelliJ IDEA, PyCharm, WebStorm and GoLand (build.gradle.kts)
      - run: ./gradlew verifyPlugin

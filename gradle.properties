# Build against the installed PyCharm when it is there; elsewhere (CI) PyCharm platformVersion is downloaded.
platformPath=/Applications/PyCharm.app
platformVersion=2026.1.2
pluginVersion=0.1.0
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.java.installations.paths=/Applications/PyCharm.app/Contents/jbr/Contents/Home
org.gradle.jvmargs=-Djava.net.preferIPv4Stack=true
